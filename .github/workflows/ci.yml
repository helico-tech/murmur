name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt,llvm-tools -t wasm32-unknown-unknown
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features murmur/sim -- -D warnings
      - run: cargo test --workspace --features murmur/sim
      - name: wasm check
        run: |
          AR="$(find "$(rustc --print sysroot)" -name llvm-ar | head -1)"
          CC_wasm32_unknown_unknown=clang AR_wasm32_unknown_unknown="$AR" cargo check -p murmur-iroh --target wasm32-unknown-unknown
      - name: Chaos (200 seeds)
        run: MURMUR_CHAOS_SEEDS=200 cargo test --release -p murmur --features sim --test sim chaos
