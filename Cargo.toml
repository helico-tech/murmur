[workspace]
resolver = "3"
members = ["crates/murmur", "crates/murmur-iroh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
repository = "https://github.com/helico-tech/murmur"

[workspace.dependencies]
murmur = { path = "crates/murmur" }

serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
log = "0.4"
blake3 = "1.8"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
data-encoding = "2"

iroh = "1.3"
n0-future = "0.3"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
